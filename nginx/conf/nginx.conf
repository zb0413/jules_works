user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 768;
    # multi_accept on;
}

http {
    # Define the custom log format
    log_format hudi_custom '$remote_addr\t$time_local\t$request_method\t$request_uri\t$server_protocol\t$status\t$body_bytes_sent\t"$http_user_agent"';

    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    # server_tokens off;

    # server_names_hash_bucket_size 64;
    # server_name_in_redirect off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # SSL Settings (optional, commented out)
    # ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
    # ssl_prefer_server_ciphers on;

    # Gzip Settings (optional, commented out)
    # gzip on;
    # gzip_disable "msie6";
    # gzip_vary on;
    # gzip_proxied any;
    # gzip_comp_level 6;
    # gzip_buffers 16 8k;
    # gzip_http_version 1.1;
    # gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Virtual Host Configs
    # include /etc/nginx/conf.d/*.conf;
    # include /etc/nginx/sites-enabled/*;

    server {
        listen 80;
        server_name localhost; # Or your specific domain

        location / {
            # Default Nginx page will be served if no root is specified
            # Or, to serve a custom page:
            # root /var/www/html;
            # index index.html index.htm;
            try_files $uri $uri/ =404; # Standard way to handle file serving
        }

        # Specify the access log and format
        access_log /var/log/nginx/access.log hudi_custom;

        # Optional: error log
        error_log /var/log/nginx/error.log warn;

        # Optional: deny access to .htaccess files, if Apache's document root
        # concurs with Nginx's one
        #
        # location ~ /\.ht {
        #    deny all;
        # }
    }
}
